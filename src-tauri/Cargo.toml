[package]
name = "rave-desktop"
version = "0.2.2"
description = "RAVE Desktop — aplikasi dengar RAVE"
authors = ["dijiwa.id"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Nama lib berbeda dari bin agar tidak bentrok di Windows (cargo#8519).
name = "rave_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Build rilis ramping: ukuran installer kecil & start cepat.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
